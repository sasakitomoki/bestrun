# Render.com Blueprint for the Kokyo Run ranking app.
# Provisions a Node.js Web Service (Next.js) and a managed PostgreSQL instance.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: kokyo-run-db
    databaseName: kokyo_run
    plan: free

services:
  - type: web
    name: kokyo-run
    runtime: node
    plan: free
    # Runs migrations before building so the app boots against an up-to-date schema.
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kokyo-run-db
          property: connectionString
      - key: NODE_VERSION
        value: "20.11.1"
      # Email notifications via Resend — set these in the Render dashboard.
      - key: RESEND_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: NOTIFY_FROM_EMAIL
        sync: false
