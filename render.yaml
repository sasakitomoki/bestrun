# Render.com Blueprint for the Kokyo Run ranking app.
# Uses an existing PostgreSQL instance (DATABASE_URL is set manually in the
# Render dashboard, or injected via fromDatabase if a new DB is created).
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: kokyo-run
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false   # Set this manually in the Render dashboard
      - key: NODE_VERSION
        value: "20.11.1"
