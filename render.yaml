# Render.com Blueprint for the Kokyo Run ranking app.
# DATABASE_URL must be set manually in the Render dashboard (Supabase Direct connection, port 5432).
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: kokyo-run
    runtime: node
    plan: free
    # Runs migrations then builds so the app boots against an up-to-date schema.
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: "20.11.1"
      # Email notifications via Resend — set these in the Render dashboard.
      - key: RESEND_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: NOTIFY_FROM_EMAIL
        sync: false
      - key: FAL_KEY
        sync: false
